# Blueprint de Render para staging (TND-005). Render despliega al fusionar a main.
# Los secretos marcados con sync: false se cargan a mano en el panel de Render; nunca en el repo.
# RELEASE no hace falta: API y scoring usan RENDER_GIT_COMMIT (el commit desplegado) para Sentry.
services:
  - type: pserv
    name: tendia-scoring
    runtime: docker
    dockerfilePath: ./services/scoring/Dockerfile
    dockerContext: ./services/scoring
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: tendia-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL # Postgres del proyecto Supabase de staging
        sync: false
      - key: SCORING_URL
        fromService:
          type: pserv
          name: tendia-scoring
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY # 32 bytes en base64
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PORTAL_URL # enlaces de invitación a analistas
        value: https://tendia-portal.onrender.com
      # Staging: los celulares de demostración (300 000 000x) ven el código en pantalla; los reales
      # lo reciben por SMS con Twilio Verify. En producción debe ser false (la API no arranca si no).
      - key: OTP_DEV_MODE
        value: 'true'
      - key: SEED_ON_START
        value: 'true'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID # opcional: si falta, la API crea el servicio "TendIA"
        sync: false
      - key: PUBLIC_API_URL # URL pública de tendia-api; valida la firma del webhook de WhatsApp
        sync: false

  - type: web
    name: tendia-portal
    runtime: docker
    dockerfilePath: ./apps/portal/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL # URL pública de tendia-api
        sync: false
