version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-y-parches:
        update-types: [minor, patch]
      # Nest se actualiza completo o no se actualiza: un paquete suelto rompe los peers.
      nestjs:
        patterns: ['@nestjs/*']
        update-types: [major]
    ignore:
      # Los tipos siguen la versión de Node del runtime (22 en CI y en Vercel).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # Las versiones de Expo se actualizan con `npx expo install --fix`, no una por una.
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
  - package-ecosystem: pip
    directory: /services/scoring
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    # Dockerfile.api, en la raíz (Vercel construye desde la carpeta del Dockerfile).
    directory: /
    schedule: { interval: monthly }
    # La imagen local usa la misma versión mayor de Node que CI y Vercel.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
