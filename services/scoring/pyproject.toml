[project]
name = "tendia-scoring"
version = "0.1.0"
description = "Motor de scoring de TendIA: scorecard interpretable de probabilidad de incumplimiento a 90 días."
requires-python = ">=3.12"
# Solo lo que usa el servicio en ejecución: el paquete que se despliega queda liviano.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.10.3",
    "numpy==2.5.4",
    "structlog==24.4.0",
    "sentry-sdk[fastapi]==2.73.0",
]

[dependency-groups]
# Entrenamiento y lectura de los datos crudos (train.py, datos/): no se despliegan.
train = [
    "scikit-learn==1.7.2",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "xlrd==2.0.2",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tendia_scoring"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tendia_scoring/synthetic.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tendia_scoring --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = [
    # Entrenamiento y descargas: corren con red y datos crudos, fuera de CI.
    "tendia_scoring/train.py",
    "tendia_scoring/datos/fuentes.py",
    "tendia_scoring/datos/emicron.py",
]
